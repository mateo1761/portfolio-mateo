# For more information: https://laravel.com/docs/sail
services:
    nginx:
        image: 'nginx:1.30.4-alpine'
        ports:
            - '${FORWARD_NGINX_PORT:-80}:80'
            - '${FORWARD_NGINX_HTTPS_PORT:-443}:443'
        volumes:
            - './docker/nginx/conf.d/portfolio-mateo.conf:/etc/nginx/conf.d/default.conf:ro'
            - './docker/nginx/certs:/etc/nginx/certs:ro'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget --quiet --tries=1 --spider http://127.0.0.1/nginx-health || exit 1',
                ]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 5s

    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/portfolio-mateo
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8080}:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            postgres:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl --fail --silent --show-error http://127.0.0.1/ > /dev/null || exit 1',
                ]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    vite:
        image: sail-8.5/portfolio-mateo
        command: npm run dev
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl --fail --silent --show-error --insecure https://127.0.0.1:5173/@vite/client > /dev/null || exit 1',
                ]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    postgres:
        image: 'postgres:16-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
